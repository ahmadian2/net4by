name: Android Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug.keystore exists on runner
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Check release signing secrets
        id: check_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured. Building Debug APK instead."
          fi

      - name: Decode release upload keystore
        if: steps.check_secrets.outputs.has_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build signed Release APK and AAB
        if: steps.check_secrets.outputs.has_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Clean up release keystore file
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload signed Release APK
        if: steps.check_secrets.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: peyvandnet-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed Release AAB
        if: steps.check_secrets.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: peyvandnet-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Build Debug APK (fallback when release secrets are not set)
        if: steps.check_secrets.outputs.has_release != 'true'
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        if: steps.check_secrets.outputs.has_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: peyvandnet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
