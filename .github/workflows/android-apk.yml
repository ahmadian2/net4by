name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        id: build
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            gradle --no-daemon :app:assembleRelease
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon :app:assembleDebug
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload signed release APK
        if: steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: net4by-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK (testing only)
        if: steps.build.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: net4by-debug-apk-not-for-market
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain signing status
        if: always()
        run: |
          if [ "${{ steps.build.outputs.signed }}" = "true" ]; then
            echo "Signed release APK built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Debug APK built for testing only; it is not suitable for market distribution." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD repository secrets to build a signed release APK." >> "$GITHUB_STEP_SUMMARY"
          fi
