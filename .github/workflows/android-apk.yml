name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          gradle --no-daemon :app:assembleRelease

      - name: Build debug APK (signing key not configured)
        if: ${{ secrets.KEYSTORE_BASE64 == '' || secrets.STORE_PASSWORD == '' || secrets.KEY_PASSWORD == '' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: net4by-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' || secrets.STORE_PASSWORD == '' || secrets.KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: net4by-debug-apk-not-for-market
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain signing status
        if: always()
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed release APK built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A debug APK was built. It is for testing only, not market distribution." >> "$GITHUB_STEP_SUMMARY"
            echo "Add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD as GitHub Actions secrets to build a signed release APK." >> "$GITHUB_STEP_SUMMARY"
          fi
